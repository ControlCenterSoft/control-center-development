name: A3 gofmt diagnostic

on:
  push:
    branches:
      - 'formatdiag/a3-0.27.0-gofmt'

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply canonical gofmt
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd internal migrations
          if git diff --quiet; then
            echo 'Already gofmt-clean.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd internal migrations
          git commit -m 'style: apply canonical gofmt [skip ci]'
          git push origin HEAD:formatdiag/a3-0.27.0-gofmt

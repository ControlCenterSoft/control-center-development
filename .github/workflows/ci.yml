name: Public CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'develop/**'
      - 'migration/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: Public safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Scan repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -f .env.staging
          if grep -RInE --exclude-dir=.git --exclude='*.sum' --exclude='ci.yml' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16})' .; then
            echo 'public-safety scan detected credential-like material' >&2
            exit 1
          fi

  static-analysis:
    name: Format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Diagnose freshness evaluator
        continue-on-error: true
        run: go test ./internal/networkpolicy -run '^(TestEvaluate|TestParseVerificationEvidence)' -count=1

      - name: Diagnose preflight admission
        continue-on-error: true
        run: go test ./internal/networkpolicy -run '^TestVerificationPreflightAdmission' -count=1

      - name: Diagnose current and admission consumers
        continue-on-error: true
        run: go test ./internal/networkpolicy -run '^(TestBuildCurrent|TestApplyCurrent|TestParseVerificationPreflightAdmission)' -count=1

      - name: Run side-effect-free tests
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build control-center
        run: go build -trimpath -buildvcs=false ./cmd/control-center

  postgres-migration-qualification:
    name: PostgreSQL ${{ matrix.postgres }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '15'
          - '16'
          - '17'
          - '18'
        scenario:
          - clean-install
          - supported-upgrade
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run isolated migration scenario
        shell: bash
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
          QUALIFICATION_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          case "$QUALIFICATION_SCENARIO" in
            clean-install)
              qualification_test=TestPostgresCleanInstallAndRestart
              ;;
            supported-upgrade)
              qualification_test=TestPostgresUpgradeFrom03PreservesLegacyState
              ;;
            *)
              echo 'unsupported qualification scenario' >&2
              exit 2
              ;;
          esac
          go test ./migrations -run "^${qualification_test}$" -count=1 -v

      - name: Qualify exact 0.31 candidate artifact lifecycle
        if: matrix.postgres == '16' && matrix.scenario == 'supported-upgrade'
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/qualify-candidate-031.sh

      - name: Preserve qualified 0.31 candidate artifacts
        if: matrix.postgres == '16' && matrix.scenario == 'supported-upgrade' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-center-0.31.0-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/candidate-0.31.0/control-center-0.31.0-linux-amd64.tar.gz
            dist/candidate-0.31.0/control-center-0.31.0-linux-amd64.tar.gz.sha256
            dist/candidate-0.31.0/control-center-0.31.0-source.tar.gz
            dist/candidate-0.31.0/control-center-0.31.0.sbom.cdx.json
            dist/candidate-0.31.0/THIRD_PARTY_NOTICES.md
            dist/candidate-0.31.0/control-center-0.31.0.provenance.json
            dist/candidate-0.31.0/control-center-0.31.0.qualification.json
            dist/candidate-0.31.0/control-center-0.31.0.release-manifest.json
            dist/candidate-0.31.0/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  postgres-adapter-compatibility:
    name: PostgreSQL ${{ matrix.postgres }} adapters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '15'
          - '16'
          - '17'
          - '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install current schema for adapter tests
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1 -v

      - name: Verify PostgreSQL adapters and restart recovery
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./internal/persistence/postgres -run '^TestPostgres' -count=1 -v

  race:
    name: Race and PostgreSQL restart tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install current schema for race tests
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1

      - name: Run race detector with PostgreSQL adapters
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test -race -count=1 ./...

  release-candidate-evidence:
    name: 0.31 release evidence aggregation
    if: always()
    needs:
      - public-safety
      - static-analysis
      - unit
      - build
      - postgres-migration-qualification
      - postgres-adapter-compatibility
      - race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require upstream qualification PASS
        shell: bash
        env:
          PUBLIC_SAFETY: ${{ needs.public-safety.result }}
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          POSTGRES_MIGRATION: ${{ needs.postgres-migration-qualification.result }}
          POSTGRES_ADAPTER: ${{ needs.postgres-adapter-compatibility.result }}
          RACE: ${{ needs.race.result }}
        run: |
          set -euo pipefail
          for value in "$PUBLIC_SAFETY" "$STATIC_ANALYSIS" "$UNIT" "$BUILD" "$POSTGRES_MIGRATION" "$POSTGRES_ADAPTER" "$RACE"; do
            [[ "$value" == success ]]
          done

      - name: Download exact qualified 0.31 candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: control-center-0.31.0-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/candidate-0.31.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Aggregate exact-bound engineering release evidence
        shell: bash
        env:
          PUBLIC_SAFETY: ${{ needs.public-safety.result }}
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          POSTGRES_MIGRATION: ${{ needs.postgres-migration-qualification.result }}
          POSTGRES_ADAPTER: ${{ needs.postgres-adapter-compatibility.result }}
          RACE: ${{ needs.race.result }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/aggregate-release-evidence-031.py \
            --candidate-dir dist/candidate-0.31.0 \
            --candidate-sha "$CANDIDATE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --public-safety "$PUBLIC_SAFETY" \
            --static-analysis "$STATIC_ANALYSIS" \
            --unit "$UNIT" \
            --build "$BUILD" \
            --postgres-migration "$POSTGRES_MIGRATION" \
            --postgres-adapter "$POSTGRES_ADAPTER" \
            --race "$RACE" \
            --workflow-evidence-output dist/candidate-0.31.0/control-center-0.31.0.workflow-evidence.json \
            --readiness-output dist/candidate-0.31.0/control-center-0.31.0.readiness.json

          validator_dir="$(mktemp -d "$PWD/.readiness-validator.XXXXXX")"
          trap 'rm -rf "$validator_dir"' EXIT
          cat > "$validator_dir/main.go" <<'GO'
          package main
          import (
            "encoding/json"
            "fmt"
            "os"
            "control-center/internal/releasecandidate"
          )
          func main() {
            raw, err := os.ReadFile(os.Args[1]); if err != nil { panic(err) }
            var snapshot releasecandidate.Snapshot
            if err := json.Unmarshal(raw, &snapshot); err != nil { panic(err) }
            result, err := releasecandidate.Evaluate(snapshot); if err != nil { panic(err) }
            if result.Ready { panic("commercial/legal blocker must keep candidate not ready") }
            if len(result.Blockers) != 1 || result.Blockers[0] != releasecandidate.GateCommercialLegal {
              panic(fmt.Sprintf("unexpected blockers: %v", result.Blockers))
            }
            fmt.Println("READINESS_SNAPSHOT=PASS_BLOCKED_ONLY_ON_COMMERCIAL_LEGAL")
          }
          GO
          go run "$validator_dir/main.go" dist/candidate-0.31.0/control-center-0.31.0.readiness.json

      - name: Preserve exact-bound release evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-center-0.31.0-release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/candidate-0.31.0/control-center-0.31.0.workflow-evidence.json
            dist/candidate-0.31.0/control-center-0.31.0.readiness.json
          if-no-files-found: error
          retention-days: 14

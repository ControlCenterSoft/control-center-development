name: ServerOps staging secret preflight

on:
  push:
    branches:
      - ops/serverops-staging-secret-preflight
    paths:
      - .github/workflows/serverops-staging-secret-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_HOST: 45.132.18.175

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
    steps:
      - name: Fail closed if staging secrets are unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_USER" || { echo 'STAGING_USER=UNAVAILABLE'; exit 21; }
          test -n "$STAGING_KEY" || { echo 'STAGING_KEY=UNAVAILABLE'; exit 22; }
          test -n "$STAGING_KNOWN_HOSTS" || { echo 'STAGING_KNOWN_HOSTS=UNAVAILABLE'; exit 23; }
          echo 'STAGING_SECRETS=AVAILABLE'

      - name: Configure ephemeral SSH client
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAGING_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Read-only remote preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'SERVEROPS_PREFLIGHT_REACHABLE=YES'
          printf 'SERVEROPS_PREFLIGHT_HOSTNAME=%s\n' "$(hostname -s 2>/dev/null || hostname)"
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            printf 'SERVEROPS_PREFLIGHT_OS_ID=%s\n' "${ID:-unknown}"
            printf 'SERVEROPS_PREFLIGHT_OS_VERSION=%s\n' "${VERSION_ID:-unknown}"
            printf 'SERVEROPS_PREFLIGHT_OS_CODENAME=%s\n' "${VERSION_CODENAME:-${UBUNTU_CODENAME:-unknown}}"
          fi
          if sudo -n true >/dev/null 2>&1; then
            echo 'SERVEROPS_PREFLIGHT_SUDO=NONINTERACTIVE_OK'
          else
            echo 'SERVEROPS_PREFLIGHT_SUDO=INTERACTIVE_OR_DENIED'
          fi
          if command -v gh >/dev/null 2>&1; then
            echo 'SERVEROPS_PREFLIGHT_GH=INSTALLED'
            if gh auth status >/dev/null 2>&1; then
              echo 'SERVEROPS_PREFLIGHT_GH_AUTH=READY'
            else
              echo 'SERVEROPS_PREFLIGHT_GH_AUTH=AUTH_REQUIRED'
            fi
          else
            echo 'SERVEROPS_PREFLIGHT_GH=NOT_INSTALLED'
            echo 'SERVEROPS_PREFLIGHT_GH_AUTH=AUTH_REQUIRED'
          fi
          if sudo -n test -f /etc/serverops/identity.json >/dev/null 2>&1; then
            echo 'SERVEROPS_PREFLIGHT_IDENTITY=PRESENT'
          else
            echo 'SERVEROPS_PREFLIGHT_IDENTITY=ABSENT'
          fi
          REMOTE

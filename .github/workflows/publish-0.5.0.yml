name: Publish Control Center 0.5.0

on:
  push:
    branches:
      - publish/0.5.0

permissions:
  contents: write

jobs:
  qualify-source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: 32de7e3931386621f84d483dc0e60655fc530d4c
      RELEASE_TAG: v0.5.0
    steps:
      - name: Checkout qualified release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Requalify source
        run: |
          set -euo pipefail
          test "$(tr -d '\n\r' < VERSION)" = "0.5.0"
          go test ./...
          go vet ./...
          go build -trimpath -buildvcs=false ./cmd/control-center
      - name: Publish immutable source tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            test "$existing" = "$TARGET_SHA"
          else
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="Control Center 0.5.0" \
              -f body="Qualified source release for Multi-node Operations and Lifecycle. Source CI is green; production deployment and artifact signing are separate protected gates." \
              -F draft=false -F prerelease=false
          fi

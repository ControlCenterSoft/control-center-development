name: CC qualify prepared first-login package

on:
  push:
    branches:
      - integration/cc-next-first-login

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current integration branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Cherry-pick prepared package onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main parallel/identity/first-login-password-change:refs/remotes/origin/prepared
          base="$(git merge-base origin/main origin/prepared)"
          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            if git cherry-pick "$commit"; then
              continue
            fi
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            if [[ -z "$conflicts" ]] && git diff --quiet && git diff --cached --quiet; then
              echo "Skipping already-integrated commit $commit"
              git cherry-pick --skip
              continue
            fi
            expected=$'README.md\ninternal/persistence/postgres/postgres_integration_test.go\nmigrations/README.md'
            if [[ "$conflicts" == "$expected" ]]; then
              echo "Prepared first-login semantics are already present in evolved current-main files"
              git checkout --ours -- README.md internal/persistence/postgres/postgres_integration_test.go migrations/README.md
              git add README.md internal/persistence/postgres/postgres_integration_test.go migrations/README.md
              if git diff --quiet && git diff --cached --quiet; then
                git cherry-pick --skip
              else
                git cherry-pick --continue
              fi
              continue
            fi
            echo "::group::Unexpected cherry-pick conflicts"
            printf '%s\n' "$conflicts"
            echo "::endgroup::"
            exit 1
          done < <(git rev-list --reverse "$base"..origin/prepared)
          git rm .github/workflows/cc-qualify-prepared.yml
          git commit -m "ci: remove first-login qualification helper"
          git push origin HEAD:integration/cc-next-first-login

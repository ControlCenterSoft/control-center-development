name: Gemini PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.fork == false && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve exact review target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
            head_sha="${EVENT_HEAD_SHA}"
            base_sha="${EVENT_BASE_SHA}"
          else
            pr_number="${INPUT_PR_NUMBER}"
            pr_json="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${pr_number}")"
            head_sha="$(jq -er '.head.sha' <<<"${pr_json}")"
            base_sha="$(jq -er '.base.sha' <<<"${pr_json}")"
          fi

          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          persist-credentials: false

      - name: Run independent Gemini review
        id: gemini_review
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
          workflow_name: control-center-gemini-exact-review
          github_pr_number: ${{ steps.target.outputs.pr_number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 20
              },
              "telemetry": {
                "enabled": false
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: >-
            You are an independent additional code-review gate for Control Center.
            Review pull request #${{ steps.target.outputs.pr_number }} at EXACT
            head_sha=${{ steps.target.outputs.head_sha }} against EXACT
            base_sha=${{ steps.target.outputs.base_sha }}. Use the GitHub MCP
            pull_request_read capability only; do not write comments, submit reviews,
            push code, merge, change rules, or create releases. Analyze only the
            necessary diff and metadata and do not expose secrets or PII. Check
            correctness, regressions, security/privacy, infrastructure neutrality,
            migration/upgrade safety, tests and stated release boundaries. If the
            exact head/base pair cannot be verified, return BLOCK. Return exactly one
            JSON object and no markdown or prose, with this schema:
            {"verdict":"PASS|BLOCK","head_sha":"40-hex-sha","base_sha":"40-hex-sha","findings":[{"severity":"blocking|warning|info","summary":"short finding"}]}.
            PASS is allowed only when there are no blocking findings.

      - name: Validate and record exact-SHA Gemini evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          ACTION_OUTCOME: ${{ steps.gemini_review.outcome }}
          GEMINI_SUMMARY: ${{ steps.gemini_review.outputs.summary }}
          GEMINI_ERROR_PRESENT: ${{ steps.gemini_review.outputs.error != '' }}
        run: |
          set -euo pipefail

          status="UNKNOWN"
          reason=""
          findings='[]'

          if [[ "${ACTION_OUTCOME}" != "success" ]]; then
            reason="Gemini provider/action failure"
          elif ! jq -e '
            type == "object" and
            (.verdict == "PASS" or .verdict == "BLOCK") and
            (.head_sha | type == "string") and
            (.base_sha | type == "string") and
            (.findings | type == "array") and
            ([.findings[] | select(
              (type != "object") or
              ((.severity == "blocking" or .severity == "warning" or .severity == "info") | not) or
              ((.summary | type == "string") | not)
            )] | length == 0)
          ' <<<"${GEMINI_SUMMARY}" >/dev/null 2>&1; then
            reason="Malformed or ambiguous Gemini response"
          else
            response_head="$(jq -r '.head_sha' <<<"${GEMINI_SUMMARY}")"
            response_base="$(jq -r '.base_sha' <<<"${GEMINI_SUMMARY}")"
            response_verdict="$(jq -r '.verdict' <<<"${GEMINI_SUMMARY}")"
            findings="$(jq -c '.findings' <<<"${GEMINI_SUMMARY}")"

            if [[ "${response_head}" != "${HEAD_SHA}" || "${response_base}" != "${BASE_SHA}" ]]; then
              reason="Gemini evidence SHA mismatch"
            elif [[ "${response_verdict}" == "PASS" ]] && jq -e '[.findings[] | select(.severity == "blocking")] | length > 0' <<<"${GEMINI_SUMMARY}" >/dev/null; then
              reason="Gemini PASS contained blocking findings"
            else
              status="${response_verdict}"
            fi
          fi

          if [[ "${status}" == "UNKNOWN" ]]; then
            evidence="$(jq -cn \
              --arg verdict "UNKNOWN" \
              --arg head_sha "${HEAD_SHA}" \
              --arg base_sha "${BASE_SHA}" \
              --arg reason "${reason}" \
              '{verdict:$verdict,head_sha:$head_sha,base_sha:$base_sha,findings:[{severity:"blocking",summary:$reason}]}')"
          else
            evidence="$(jq -cn \
              --arg verdict "${status}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg base_sha "${BASE_SHA}" \
              --argjson findings "${findings}" \
              '{verdict:$verdict,head_sha:$head_sha,base_sha:$base_sha,findings:$findings}')"
          fi

          {
            echo '### Gemini exact-SHA review evidence'
            echo
            echo '```json'
            echo "${evidence}"
            echo '```'
            echo
            echo 'Gemini evidence is supplemental and does not replace deterministic CI, security qualification, branch protection or independent approvals.'
          } >> "${GITHUB_STEP_SUMMARY}"

          marker="<!-- gemini-exact-review:v1 head=${HEAD_SHA} base=${BASE_SHA} -->"
          body="$(printf '%s\nGemini supplemental review evidence recorded by GitHub Actions. This is not a protected-branch approval.\n\n```json\n%s\n```' "${marker}" "${evidence}")"
          payload="$(jq -cn --arg body "${body}" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "${payload}" >/dev/null

          if [[ "${status}" != "PASS" ]]; then
            echo "::error title=Gemini review gate::${status}: ${reason:-blocking findings}"
            exit 1
          fi

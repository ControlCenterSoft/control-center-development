name: Publish official release

on:
  workflow_run:
    workflows:
      - Public CI
      - Qualify Control Center 0.32 exact SHA
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: official-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Evaluate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Evaluate release authorization
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE_${version}_RU.md"
          test -f "$notes"

          publishable=false
          if grep -Eq '^Status: official release\.?$' "$notes"; then
            publishable=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"

          if [[ "$publishable" == true ]]; then
            echo "RELEASE_AUTHORIZATION=OFFICIAL version=${version}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASE_AUTHORIZATION=DEVELOPMENT_NO_PUBLISH version=${version}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report development release state
        if: steps.release.outputs.publishable != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "RELEASE_STATE=DEVELOPMENT_NO_PUBLISH version=${RELEASE_VERSION} sha=${RELEASE_SHA}"
          echo "No tag, GitHub Release, or Stable promotion is authorized for this development revision."

      - name: Detect already-published immutable release
        if: steps.release.outputs.publishable == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify already-published release remains immutable
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          python3 - "$RELEASE_TAG" "$tag_sha" "$release_json" <<'PY'
          import json, re, sys
          tag, tag_sha, raw = sys.argv[1:]
          data = json.loads(raw)
          if data.get("tag_name") != tag or data.get("draft") is not False or data.get("prerelease") is not False:
              raise SystemExit("published_release_not_stable")
          if re.fullmatch(r"[0-9a-f]{40}", tag_sha) is None:
              raise SystemExit("published_release_tag_identity_invalid")
          print(f"PUBLISHED_RELEASE_IMMUTABLE={tag}@{tag_sha}")
          PY

      - name: Require a version-specific automatic publication gate
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            0.31.0)
              [[ "$TRIGGER_WORKFLOW" == "Public CI" ]] || { echo '0.31 publication requires its historical Public CI trigger' >&2; exit 53; }
              echo 'RELEASE_GATE=legacy-0.31'
              ;;
            0.32.1)
              [[ "$TRIGGER_WORKFLOW" == "Qualify Control Center 0.32 exact SHA" ]] || {
                echo 'RELEASE_STALLED: Control Center 0.32.1 requires the dedicated exact-SHA qualification workflow; Public CI alone is not publication authority.' >&2
                exit 53
              }
              echo 'RELEASE_GATE=exact-sha-0.32'
              ;;
            *)
              echo "Automatic publication gate is not defined for Control Center ${RELEASE_VERSION}; refusing publication" >&2
              exit 53
              ;;
          esac

      - name: Download exact 0.31 release evidence
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.31.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p dist/public-stable-evidence
          gh run download "$TRIGGER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "control-center-0.31.0-release-evidence-${RELEASE_SHA}" \
            --dir dist/public-stable-evidence
          test -f dist/public-stable-evidence/control-center-0.31.0.readiness.json

      - name: Set up Go for 0.31 Stable gate
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.31.0'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require exact technical Public Stable readiness
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.31.0'
        shell: bash
        run: |
          set -euo pipefail
          validator_dir="$(mktemp -d "$PWD/.stable-readiness-validator.XXXXXX")"
          trap 'rm -rf "$validator_dir"' EXIT
          cat > "$validator_dir/main.go" <<'GO'
          package main
          import (
            "encoding/json"
            "fmt"
            "os"
            "control-center/internal/releasecandidate"
          )
          func main() {
            raw, err := os.ReadFile(os.Args[1]); if err != nil { panic(err) }
            var snapshot releasecandidate.Snapshot
            if err := json.Unmarshal(raw, &snapshot); err != nil { panic(err) }
            product, err := releasecandidate.EvaluateProductStable(snapshot); if err != nil { panic(err) }
            if !product.Ready || len(product.Blockers) != 0 {
              panic(fmt.Sprintf("product Stable readiness blocked: %v", product.Blockers))
            }
            commercial, err := releasecandidate.Evaluate(snapshot); if err != nil { panic(err) }
            if !commercial.Ready {
              if len(commercial.Blockers) != 1 || commercial.Blockers[0] != releasecandidate.GateCommercialLegal {
                panic(fmt.Sprintf("unexpected non-commercial blockers: %v", commercial.Blockers))
              }
            }
            fmt.Println("PRODUCT_PUBLIC_STABLE_READINESS=PASS")
          }
          GO
          go run "$validator_dir/main.go" dist/public-stable-evidence/control-center-0.31.0.readiness.json

      - name: Download and verify exact 0.32 qualification evidence
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.32.1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p dist/public-stable-evidence
          gh run download "$TRIGGER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "control-center-0.32.1-release-evidence-${RELEASE_SHA}" \
            --dir dist/public-stable-evidence
          for name in \
            control-center-0.32.1-linux-amd64.tar.gz \
            control-center-0.32.1-linux-amd64.tar.gz.sha256 \
            control-center-0.32.1-source.tar.gz \
            control-center-0.32.1.sbom.cdx.json \
            THIRD_PARTY_NOTICES.md \
            control-center-0.32.1.qualification.json \
            control-center-0.32.1.provenance.json \
            control-center-0.32.1.release-manifest.json \
            SHA256SUMS; do
            test -s "dist/public-stable-evidence/$name" || { echo "qualification asset missing: $name" >&2; exit 66; }
          done
          (cd dist/public-stable-evidence && sha256sum -c SHA256SUMS)
          public_ci_run_id="$(python3 - "$RELEASE_SHA" <<'PY'
          import json, pathlib, sys
          sha=sys.argv[1]
          root=pathlib.Path('dist/public-stable-evidence')
          q=json.loads((root/'control-center-0.32.1.qualification.json').read_text(encoding='utf-8'))
          m=json.loads((root/'control-center-0.32.1.release-manifest.json').read_text(encoding='utf-8'))
          p=json.loads((root/'control-center-0.32.1.provenance.json').read_text(encoding='utf-8'))
          if q.get('schema')!='control-center.candidate-qualification.v2' or q.get('status')!='PASS': raise SystemExit('QUALIFICATION_NOT_PASS')
          if q.get('candidate_version')!='0.32.1' or q.get('candidate_sha')!=sha: raise SystemExit('QUALIFICATION_IDENTITY_MISMATCH')
          if q.get('stable_base',{}).get('version')!='0.31.1': raise SystemExit('QUALIFICATION_STABLE_BASE_MISMATCH')
          if q.get('publication_authority') is not False: raise SystemExit('QUALIFICATION_AUTHORITY_INVALID')
          if any(value!='PASS' for value in q.get('gates',{}).values()): raise SystemExit('QUALIFICATION_GATE_NOT_PASS')
          if m.get('version')!='0.32.1' or m.get('revision')!=sha or m.get('status')!='qualified-not-yet-published': raise SystemExit('RELEASE_MANIFEST_IDENTITY_MISMATCH')
          if m.get('publication_authority') is not False: raise SystemExit('RELEASE_MANIFEST_AUTHORITY_INVALID')
          if p.get('candidate_version')!='0.32.1' or p.get('candidate_sha')!=sha: raise SystemExit('PROVENANCE_IDENTITY_MISMATCH')
          if p.get('publication_authority') is not False: raise SystemExit('PROVENANCE_AUTHORITY_INVALID')
          run_id=q.get('public_ci',{}).get('run_id')
          if not isinstance(run_id,int) or run_id < 1: raise SystemExit('PUBLIC_CI_EVIDENCE_MISSING')
          if q.get('public_ci',{}).get('candidate_sha')!=sha or q.get('public_ci',{}).get('status')!='PASS': raise SystemExit('PUBLIC_CI_EVIDENCE_IDENTITY_MISMATCH')
          print(run_id)
          PY
          )"
          public_ci_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${public_ci_run_id}")"
          python3 - "$RELEASE_SHA" "$public_ci_json" <<'PY'
          import json,sys
          sha,raw=sys.argv[1:]
          run=json.loads(raw)
          if run.get('name')!='Public CI' or run.get('head_sha')!=sha or run.get('conclusion')!='success':
              raise SystemExit('PUBLIC_CI_RUN_NOT_EXACT_PASS')
          print(f"CC_032_EXACT_SHA_PUBLIC_CI=PASS run_id={run['id']} sha={sha}")
          PY

      - name: Publish exact qualified source release
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          tag_sha=""
          if existing_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            tag_sha="$existing_tag_sha"
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "${RELEASE_TAG} already points to ${tag_sha}, expected ${RELEASE_SHA}" >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_SHA" >/dev/null
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Control Center ${RELEASE_VERSION}" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag

          if [[ "$RELEASE_VERSION" == "0.32.1" ]]; then
            gh release upload "$RELEASE_TAG" dist/public-stable-evidence/* --repo "$GITHUB_REPOSITORY"
            echo "QUALIFIED_SOURCE_RELEASE=PUBLISHED version=${RELEASE_VERSION} sha=${RELEASE_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Stable promotion remains a separate required step; this development-repository release is not Public Stable." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASE_STATE=PUBLISHED version=${RELEASE_VERSION} sha=${RELEASE_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report existing official release state
        if: steps.release.outputs.publishable == 'true' && steps.existing.outputs.published == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "RELEASE_STATE=ALREADY_PUBLISHED_IMMUTABLE version=${RELEASE_VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"

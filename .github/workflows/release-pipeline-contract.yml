name: Release pipeline contract

on:
  pull_request:
    paths:
      - '.github/workflows/qualify-release-032.yml'
      - '.github/workflows/qualify-release-0321.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/publish-release-0321.yml'
      - '.github/workflows/release-pipeline-contract.yml'
      - 'scripts/build-candidate-032.sh'
      - 'scripts/qualify-candidate-032.sh'
      - 'scripts/generate-sbom-032.py'
      - 'scripts/test-release-032-contract.sh'
      - 'VERSION'
      - 'docs/RELEASE_0.32.0_RU.md'
      - 'docs/RELEASE_0.32.1_RU.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qualify-release-032.yml'
      - '.github/workflows/qualify-release-0321.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/publish-release-0321.yml'
      - '.github/workflows/release-pipeline-contract.yml'
      - 'scripts/build-candidate-032.sh'
      - 'scripts/qualify-candidate-032.sh'
      - 'scripts/generate-sbom-032.py'
      - 'scripts/test-release-032-contract.sh'
      - 'VERSION'
      - 'docs/RELEASE_0.32.0_RU.md'
      - 'docs/RELEASE_0.32.1_RU.md'

permissions:
  contents: read

concurrency:
  group: release-pipeline-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 0.32 release identity contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify release pipeline contract
        shell: bash
        run: bash scripts/test-release-032-contract.sh

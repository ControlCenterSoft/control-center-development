openapi: 3.0.3
info:
  title: Control Center Audit Event Read API
  version: 0.4.0
  description: >-
    Bounded, permission-gated read contract for append-only Control Center audit
    events. This contract is read-only and does not modify audit history.
paths:
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: List security audit events
      description: >-
        Returns audit events newest first. Access requires an authenticated
        session with a completed first-login password change and the global
        audit.events.read permission. Filters are exact matches, including
        event_id and correlation_id. Optional time filtering requires both from
        and to, uses an inclusive from and exclusive to boundary, and is limited
        to at most 31 days. New pagination cursors are opaque, HMAC-authenticated,
        and bound to the authenticated session plus the normalized query shape,
        including limit, exact filters, and time window. A cursor therefore cannot
        be reused with a different query or session. Legacy v1 cursors remain
        accepted only for unfiltered reads so existing unfiltered pagination can
        finish safely; filtered pagination must restart to obtain a v2 cursor.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor returned as next_cursor by a previous response. A v2
            cursor must be reused only by the same authenticated session and with
            the same normalized limit, filters, and from/to window. Legacy v1
            cursors are accepted only when no filters or time window are supplied.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: action
          in: query
          required: false
          description: Exact audit action filter.
          schema:
            type: string
            maxLength: 192
        - name: outcome
          in: query
          required: false
          description: Exact audit outcome filter.
          schema:
            type: string
            maxLength: 32
        - name: actor_id
          in: query
          required: false
          description: Exact actor identifier filter.
          schema:
            type: string
            maxLength: 128
        - name: subject_id
          in: query
          required: false
          description: Exact subject identifier filter.
          schema:
            type: string
            maxLength: 256
        - name: event_id
          in: query
          required: false
          description: Exact audit event identifier filter. At most one event can match a stored event ID.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: correlation_id
          in: query
          required: false
          description: >-
            Exact correlation identifier filter. Multiple events can share one
            correlation identifier, so normal bounded pagination still applies.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: from
          in: query
          required: false
          description: >-
            Inclusive RFC 3339 lower time bound. Must be supplied together with
            to. The complete requested time window may not exceed 31 days.
          schema:
            type: string
            format: date-time
            maxLength: 64
        - name: to
          in: query
          required: false
          description: >-
            Exclusive RFC 3339 upper time bound. Must be supplied together with
            from. The complete requested time window may not exceed 31 days.
          schema:
            type: string
            format: date-time
            maxLength: 64
      responses:
        '200':
          description: Bounded page of audit events matching all supplied filters.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          description: Invalid, ambiguous, repeated, unsupported, unbounded, or cursor/query-mismatched request.
        '401':
          description: Authentication is required.
        '403':
          description: Password change is required or audit.events.read is denied.
        '503':
          description: Audit storage/read, cursor generation, or required read-evidence recording is unavailable.
components:
  schemas:
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          maxLength: 128
          description: >-
            Opaque cursor for the next older page; omitted when no page remains.
            New cursors are bound to the issuing authenticated session and the
            normalized query shape and must not be parsed or modified by clients.
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurred_at
        - action
        - outcome
        - hash
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
          maxLength: 192
        outcome:
          type: string
          maxLength: 32
        actor_id:
          type: string
        subject_id:
          type: string
        source_ip:
          type: string
        correlation_id:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Redacted structured event details; credentials and bearer values are not exposed.
        previous_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
